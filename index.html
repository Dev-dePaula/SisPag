<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zait PAY - Sistema Multicontas</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="account-selector-wrapper">
          <label class="item-meta-label">Ambiente Atual</label>
          <select id="globalAccountSelector" class="select-account-switcher">
            <option value="admin">⚙️ Painel Admin Geral</option>
            <option value="zait">💎 Cliente: Zait Pay</option>
            <option value="voltz">⚡ Cliente: Voltz Pay</option>
          </select>
        </div>

        <h1 class="brand-title" id="mainBrandTitle">Zait PAY</h1>
        <p class="brand-subtitle" id="mainBrandSubtitle">Gestão Unificada de Sub-Instâncias</p>
        
        <nav class="sidebar-nav" id="sidebarNav">
          </nav>
      </div>

      <div class="white-label-card">
        <h3 id="badgeWhiteLabelTitle">Core Engine Actived</h3>
        <p id="badgeWhiteLabelDesc">Estrutura preparada para APIs BAAS, PIX, Cartão, Boleto, Split e Recorrência.</p>
      </div>
    </aside>

    <main class="main-content" id="mainDynamicContent">
      </main>
  </div>

  <div class="modal-overlay" id="modalNovaCobranca">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="panel-title">Gerar Lançamento Financeiro</h3>
        <button class="btn-close-modal" id="btnFecharModal">&times;</button>
      </div>
      
      <form class="billing-form" id="formModalCobranca">
        <div class="form-group">
          <label>Nome do Cliente / Favorecido</label>
          <input type="text" id="cobCliente" placeholder="Digite o nome" required>
        </div>

        <div class="form-group">
          <label>Valor (R$)</label>
          <input type="number" step="0.01" id="cobValor" placeholder="0.00" required>
        </div>

        <div class="form-group" id="groupFormMetodo">
          <label>Método de Pagamento</label>
          <select id="cobMetodo">
            <option value="PIX">PIX</option>
            <option value="Cartão">Cartão de Crédito</option>
            <option value="Boleto">Boleto Bancário</option>
          </select>
        </div>

        <div class="form-group">
          <label>Data de Vencimento</label>
          <input type="date" id="cobVencimento" required>
        </div>

        <div class="form-group">
          <label>Descrição / Payload</label>
          <textarea id="cobDescricao" rows="2" placeholder="Observações internas"></textarea>
        </div>

        <button type="submit" class="btn-primary btn-block">Confirmar Transação</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="modalPixSucesso">
    <div class="modal-card" style="max-width: 420px; text-align: center;">
      <div class="modal-header" style="justify-content: center; position: relative;">
        <h3 class="panel-title" id="pixModalTitulo">Processado</h3>
        <button class="btn-close-modal" id="btnFecharModalPix" style="position: absolute; right: 0; top: -5px;">&times;</button>
      </div>
      
      <p class="panel-subtitle" id="pixModalMensagem" style="margin-bottom: 20px;"></p>
      
      <div id="wrapperDisplayVisual">
        <div class="qrcode-container-modal">
          <div id="qrcodeRenderSpace"></div>
        </div>
        
        <div class="form-group" style="margin-top: 20px; text-align: left;">
          <label>Código Copia e Cola / Hash Log</label>
          <input type="text" id="inputPixCopiaCola" readonly style="font-family: monospace; font-size: 0.8rem; background: #070b14;">
        </div>
      </div>

      <button class="btn-primary btn-block" id="btnCopiarPixGeral" style="margin-top: 20px;">Copiar Registro</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
